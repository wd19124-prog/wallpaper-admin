<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>壁纸运营后台</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script>window.lucide||document.write('<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"><\/script>')</script>
<script src="https://static.cloudbase.net/cloudbase-js-sdk/2.17.3/cloudbase.full.js"></script>
<script src="config.js"></script>
</head>
<body>
<section id="login" class="center" hidden>
  <form class="card login" id="lf" data-s>
    <h1 data-s>壁纸运营后台</h1>
    <p class="muted" data-s>使用在 CloudBase 控制台创建的管理员账号登录</p>
    <label data-s>账号<input name="u" autocomplete="username" required></label>
    <label data-s>密码<input name="p" type="password" autocomplete="current-password" required></label>
    <button class="btn primary" data-s>登录</button>
    <p class="err" id="le"></p>
  </form>
  <form class="card login" id="initf" hidden>
    <h1>初始化</h1>
    <p class="muted">当前账号还不是管理员</p><p>你的账号编号 <b id="myuid"></b></p><p class="muted">第一次使用 请输入初始化密钥 成为超级管理员 如果已有管理员 请把上面的账号编号发给他 让他在管理员页面添加你</p>
    <label>初始化密钥<input name="k" type="password" required></label>
    <button class="btn primary">初始化</button>
    <button class="btn" type="button" id="lo1">退出</button>
  </form>
</section>
<div id="shell" hidden>
  <aside id="nav"></aside>
  <main><header class="top"><span id="who" class="muted"></span><button class="btn" id="lo">退出登录</button></header><div id="view"></div></main>
</div>
<div id="drawer" class="drawer"><div class="mask"></div><div class="panel"></div></div>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
